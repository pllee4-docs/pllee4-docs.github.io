site_name: pllee4 docs
site_description: Notes, explainers and interactive write-ups.
site_intro: >
  This is where I store quick overviews (generated by AI) of papers I have read,
  as a convenient reference for a quick refresh when revisiting topics.

theme:
  palette:
    light:
      primary: "#4051b5"
      primary_fg: "#fff"
      bg: "#fff"
      fg: "#333"
      fg_light: "#666"
      surface: "#f8f9fa"
      border: "#e0e0e0"
      hover: "#f0f0f5"
      accent: "#4051b5"
    dark:
      primary: "#303f9f"
      primary_fg: "#fff"
      bg: "#1a1a2e"
      fg: "#dddde8"
      fg_light: "#9898b0"
      surface: "#1e1e34"
      border: "#2a2a44"
      hover: "#24243c"
      accent: "#8c9eff"
  font:
    family: "-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif"
  layout:
    sidebar_width: 240
    header_height: 50
    toc_width: 200
    breakpoint: 960

# Content colours, type and components live in assets/explainer.css.

extra_css: []
